name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: |
          docker run -d --name pako-pg --shm-size=512m -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pako_dev -p 5433:5432 postgres:16-alpine -c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          until docker exec pako-pg pg_isready -U postgres; do sleep 1; done
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build backend/Pako.Tests/Pako.Tests.csproj
      - run: dotnet test backend/Pako.Tests/Pako.Tests.csproj --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --logger "console;verbosity=minimal"
        env:
          PAKO_TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5433;Database=pako_dev;Username=postgres;Password=postgres"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test -- --run
      - run: pnpm --filter web build
