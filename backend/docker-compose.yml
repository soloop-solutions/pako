name: pako

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pako_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pako_postgres_data:/var/lib/postgresql/data

volumes:
  pako_postgres_data:
    name: backend_pako_postgres_data
