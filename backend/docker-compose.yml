name: pako

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pako_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    shm_size: 256mb
    volumes:
      - pako_postgres_data:/var/lib/postgresql/data
      # docs/DEMO_ACCOUNTS.md: a NEW (empty) volume starts with the demo data set. An existing volume
      # keeps its data; load the demo set into it with scripts/demo/load_demo_db.sh.
      - ./seed:/docker-entrypoint-initdb.d:ro

volumes:
  pako_postgres_data:
    name: backend_pako_postgres_data
