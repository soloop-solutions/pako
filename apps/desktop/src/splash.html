<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>PAKO</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc;
        -webkit-user-select: none; user-select: none;
      }
      h1 { font-size: 32px; letter-spacing: 0.2em; margin: 0 0 16px; }
      p { margin: 0; opacity: 0.7; font-size: 14px; }
      .bar { width: 160px; height: 3px; margin-top: 24px; background: #1e293b; overflow: hidden; border-radius: 2px; }
      .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #38bdf8; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <h1>PAKO</h1>
    <p>Starting...</p>
    <div class="bar"></div>
  </body>
</html>
